name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --icon=logo.ico --add-data "logo.ico;." JHJ_PySerial-GUI.py

      - name: Build Application (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --name="JHJ_PySerial-GUI-MacOS" --add-data "logo.ico:." JHJ_PySerial-GUI.py
          cd dist
          zip -r JHJ_PySerial-GUI-MacOS.zip JHJ_PySerial-GUI-MacOS.app

      - name: Build Application (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name="JHJ_PySerial-GUI-Linux" --add-data "logo.ico:." JHJ_PySerial-GUI.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/JHJ_PySerial-GUI.exe
            dist/JHJ_PySerial-GUI-MacOS.zip
            dist/JHJ_PySerial-GUI-Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
